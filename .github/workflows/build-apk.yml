name: Build APK

# Compila el APK en la nube de GitHub (no hace falta Android Studio).
# Se ejecuta con cada push a main/master, o a mano desde la pestaña Actions.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de depuracion
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NiifLock-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica el APK como "release" para tener un enlace directo de descarga desde el celular.
      - name: Publicar release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NiifLock build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
